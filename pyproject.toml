[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "boxer-sorter"
version = "0.1.0"
description = "Viam xArm6 and RealSense color sorting"
requires-python = ">=3.11"
dependencies = [
  "viam-sdk==0.85.2",
  "python-dotenv>=1.2,<2",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "opencv-python-headless>=4.11,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
boxer = "boxer.cli:main"

[tool.setuptools.packages.find]
include = ["boxer*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
